services:
  - type: web
    name: tech-interview-prep-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /v1/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: UPSTREAM_TIMEOUT_MS
        value: "5000"
      - key: CORS_ALLOWED_ORIGINS
        value: https://tech-interview-prep-1ux.pages.dev
      - key: SUPABASE_URL
        value: https://aptxrianhyxvdjnuyruo.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_JWT_ISSUER
        sync: false
