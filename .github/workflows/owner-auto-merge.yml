name: Owner PR auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-owner-pr:
    if: github.event.pull_request.user.login == 'muhamaadessam'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for owner PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --auto
